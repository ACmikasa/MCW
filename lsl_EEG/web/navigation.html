<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航管理 · EEG 智控平台</title><link rel="stylesheet" href="/assets/system.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">EEG</div><div><strong>脑电智控平台</strong><small>Neural Control Center</small></div></div><nav id="side-nav" class="nav"></nav><div class="sidebar-foot"><div class="user-card" id="current-user"></div><button id="logout" class="logout">退出登录</button></div></aside><main class="main"><header class="topbar"><div><h1>导航管理</h1><p>配置菜单名称、地址、可见权限和显示顺序</p></div><button class="btn" onclick="openForm()">＋ 新增导航</button></header><section class="card"><div class="card-head"><h2>导航列表</h2><span class="muted" id="count"></span></div><div id="table"></div></section></main></div><div class="modal" id="modal"><div class="modal-box"><div class="modal-title"><h2 id="form-title">新增导航</h2><button class="close" onclick="closeForm()">×</button></div><form id="form"><input type="hidden" id="item-id"><div class="form-grid"><div class="field"><label>导航名称</label><input class="input" id="title" maxlength="30" required></div><div class="field"><label>图标（1–4 字符）</label><input class="input" id="icon" maxlength="4" value="•"></div><div class="field full"><label>站内地址</label><input class="input" id="path" placeholder="/example" required></div><div class="field"><label>可见权限</label><select id="permission"></select></div><div class="field"><label>显示顺序</label><input class="input" id="sort-order" type="number" value="100"></div><div class="field full"><label class="check"><input id="visible" type="checkbox" checked> 在侧边栏显示</label></div></div><div class="actions" style="justify-content:flex-end;margin-top:20px"><button type="button" class="btn secondary" onclick="closeForm()">取消</button><button class="btn" type="submit">保存</button></div></form></div></div><div id="toast" class="toast"></div><script src="/assets/system.js"></script><script>
let items=[],permissions={};async function load(){const data=await api('/api/system/navigation/all');items=data.items;permissions=data.permissions;$('#count').textContent=`共 ${items.length} 项`;$('#permission').innerHTML='<option value="">所有登录用户</option>'+Object.entries(permissions).map(([k,v])=>`<option value="${escapeHtml(k)}">${escapeHtml(v)}</option>`).join('');$('#table').innerHTML=items.length?`<table><thead><tr><th>顺序</th><th>导航</th><th>地址</th><th>可见权限</th><th>状态</th><th>操作</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.sort_order}</td><td>${escapeHtml(x.icon)}　${escapeHtml(x.title)}</td><td>${escapeHtml(x.path)}</td><td>${escapeHtml(permissions[x.permission]||'所有登录用户')}</td><td><span class="status ${x.is_visible?'':'failed'}">${x.is_visible?'显示':'隐藏'}</span></td><td><div class="actions"><button class="btn secondary small" onclick="openForm(${x.id})">编辑</button><button class="btn danger small" onclick="removeItem(${x.id})">删除</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无导航项</div>'}
function openForm(id){const x=items.find(v=>v.id===id);$('#form-title').textContent=x?'编辑导航':'新增导航';$('#item-id').value=x?.id||'';$('#title').value=x?.title||'';$('#icon').value=x?.icon||'•';$('#path').value=x?.path||'';$('#permission').value=x?.permission||'';$('#sort-order').value=x?.sort_order??100;$('#visible').checked=x?.is_visible??true;$('#modal').classList.add('open')}
function closeForm(){$('#modal').classList.remove('open')}async function removeItem(id){if(!confirm('确定删除这个导航项吗？'))return;try{await api(`/api/system/navigation/${id}`,{method:'DELETE'});toast('导航项已删除');await load();await initShell()}catch(e){toast(e.message)}}
$('#form').onsubmit=async e=>{e.preventDefault();const id=$('#item-id').value,payload={title:$('#title').value,icon:$('#icon').value,path:$('#path').value,permission:$('#permission').value,sort_order:Number($('#sort-order').value),is_visible:$('#visible').checked};try{await api(id?`/api/system/navigation/${id}`:'/api/system/navigation',{method:id?'PUT':'POST',body:JSON.stringify(payload)});closeForm();toast('导航配置已保存');await load();await initShell()}catch(error){toast(error.message)}};(async()=>{try{await initShell();await load()}catch(e){toast(e.message)}})();
</script></body></html>
