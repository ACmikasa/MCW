<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史记录 · EEG 智控平台</title><link rel="stylesheet" href="/assets/system.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">EEG</div><div><strong>脑电智控平台</strong><small>Neural Control Center</small></div></div><nav id="side-nav" class="nav"></nav><div class="sidebar-foot"><div class="user-card" id="current-user"></div><button id="logout" class="logout">退出登录</button></div></aside><main class="main"><header class="topbar"><div><h1>历史记录</h1><p>检索采集任务与实验数据，回放历史波形并下载原始文件</p></div><a class="btn" href="/realtime" style="text-decoration:none">开始实时采集</a></header><section class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="stat-label">全部记录</div><div class="stat-value" id="all-count">0</div><div class="stat-foot">当前筛选结果</div></div><div class="card"><div class="stat-label">采集任务</div><div class="stat-value" id="task-count">0</div><div class="stat-foot">实时检测任务</div></div><div class="card"><div class="stat-label">实验文件</div><div class="stat-value" id="file-count">0</div><div class="stat-foot">CSV / EDF / BDF</div></div></section><section class="card"><div class="toolbar"><input class="input" id="query" placeholder="搜索任务或文件名"><select id="record-type"><option value="">全部记录</option><option value="acquisition">采集任务</option><option value="file">实验文件</option></select><select id="status"><option value="">全部状态</option><option value="completed">已完成</option><option value="running">进行中</option><option value="failed">失败</option><option value="uploaded">已上传</option></select><input class="input" id="date-from" type="date" title="开始日期"><input class="input" id="date-to" type="date" title="结束日期"><button class="btn secondary" onclick="loadHistory()">筛选</button></div><div id="history-table"></div></section></main></div><div class="modal" id="preview-modal"><div class="modal-box"><div class="modal-title"><div><h2 id="preview-title">历史波形回放</h2><div class="muted" id="preview-meta"></div></div><button class="close" onclick="closePreview()">×</button></div><div class="toolbar"><select id="preview-channel"></select><button id="play" class="btn small" onclick="togglePlay()">▶ 播放</button><span class="muted" id="play-time">0.00 s</span></div><canvas id="waveform" class="chart" width="900" height="280"></canvas><input id="timeline" class="range" type="range" min="0" max="100" value="0"><p class="muted" style="font-size:12px">波形已为浏览器显示自动抽样；下载仍保留原始文件。</p></div></div><div id="toast" class="toast"></div><script src="/assets/system.js"></script><script>
let preview=null,timer=null,position=0;async function loadHistory(){try{const p=new URLSearchParams({q:$('#query').value,record_type:$('#record-type').value,status:$('#status').value,date_from:$('#date-from').value,date_to:$('#date-to').value});const data=await api('/api/system/history?'+p);$('#all-count').textContent=data.counts.all;$('#task-count').textContent=data.counts.acquisition;$('#file-count').textContent=data.counts.file;$('#history-table').innerHTML=data.items.length?`<table><thead><tr><th>记录</th><th>类型</th><th>时间</th><th>采样信息</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.items.map(x=>`<tr><td><strong>${escapeHtml(x.name)}</strong><br><span class="muted">${escapeHtml(x.operator_name||x.job_id||'')}</span></td><td>${x.record_type==='acquisition'?'采集任务':x.file_type.toUpperCase()+' 文件'}</td><td>${localTime(x.created_at)}</td><td>${x.record_type==='acquisition'?`${x.channel_count} 通道 · ${x.sample_rate} Hz · ${x.sample_count} 点`:bytes(x.size_bytes)}</td><td><span class="status ${['failed','interrupted'].includes(x.status)?'failed':''}">${statusName(x.status)}</span></td><td><div class="actions">${x.record_type==='file'?`<button class="btn secondary small" onclick="openPreview('${x.id}')">回放波形</button><a class="btn secondary small" style="text-decoration:none" href="/api/system/history/files/${x.id}/download">下载</a><a class="btn small" style="text-decoration:none" href="/analysis?record=${x.id}">分析</a>`:`<span class="muted">${Number(x.duration_seconds).toFixed(1)} 秒</span>`}</div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有符合条件的历史记录</div>'}catch(e){toast(e.message)}}function statusName(s){return ({completed:'已完成',running:'进行中',failed:'失败',interrupted:'已中断',uploaded:'已上传',queued:'排队中',analyzing:'分析中'})[s]||s}
async function openPreview(id){try{preview=await api(`/api/system/history/files/${id}/preview`);position=0;$('#preview-title').textContent=preview.record.original_name;$('#preview-meta').textContent=`${preview.channel_labels.length} 通道 · ${preview.sample_rate} Hz · ${preview.duration_seconds} 秒`;$('#preview-channel').innerHTML=preview.channel_labels.map((x,i)=>`<option value="${i}">${escapeHtml(x)}</option>`).join('');$('#timeline').value=0;$('#preview-modal').classList.add('open');drawWave()}catch(e){toast(e.message)}}function closePreview(){clearInterval(timer);timer=null;$('#preview-modal').classList.remove('open')}function drawWave(){if(!preview)return;const canvas=$('#waveform'),ctx=canvas.getContext('2d'),values=preview.samples[+$('#preview-channel').value],times=preview.timestamps,n=values.length,start=Math.floor(position*Math.max(0,n-250)),end=Math.min(n,start+250),slice=values.slice(start,end);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#20324a';ctx.lineWidth=1;for(let y=35;y<canvas.height;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}const min=Math.min(...slice),max=Math.max(...slice),range=max-min||1;ctx.strokeStyle='#34d6c7';ctx.lineWidth=2;ctx.beginPath();slice.forEach((v,i)=>{const x=i/Math.max(1,slice.length-1)*canvas.width,y=canvas.height-20-(v-min)/range*(canvas.height-40);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();$('#play-time').textContent=`${(times[start]||0).toFixed(2)} s`}function togglePlay(){if(timer){clearInterval(timer);timer=null;$('#play').textContent='▶ 播放';return}$('#play').textContent='❚❚ 暂停';timer=setInterval(()=>{position+=.01;if(position>=1){position=0;clearInterval(timer);timer=null;$('#play').textContent='▶ 播放'}$('#timeline').value=position*100;drawWave()},80)}$('#timeline').oninput=e=>{position=+e.target.value/100;drawWave()};$('#preview-channel').onchange=drawWave;$('#query').onkeydown=e=>{if(e.key==='Enter')loadHistory()};(async()=>{try{await initShell();await loadHistory()}catch(e){toast(e.message)}})();
</script></body></html>
