<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据分析 · EEG 智控平台</title><link rel="stylesheet" href="/assets/system.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">EEG</div><div><strong>脑电智控平台</strong><small>Neural Control Center</small></div></div><nav id="side-nav" class="nav"></nav><div class="sidebar-foot"><div class="user-card" id="current-user"></div><button id="logout" class="logout">退出登录</button></div></aside><main class="main"><header class="topbar"><div><h1>数据分析</h1><p>滤波、FFT、PSD、时频图与算法检测的一体化工作台</p></div><a class="btn secondary" href="/history" style="text-decoration:none">查看历史记录</a></header><section class="grid analysis-layout"><aside class="card"><div class="card-head"><h2>分析配置</h2></div><div class="field"><label>实验文件</label><select id="record"></select></div><div class="field"><label>采样率（Hz）</label><input class="input" id="sample-rate" type="number" value="500" min="2"></div><div class="field"><label>分析通道（从 1 开始）</label><input class="input" id="channel" type="number" value="1" min="1"></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>低截止频率</label><input class="input" id="low" type="number" value="1" min="0" step="0.5"></div><div class="field"><label>高截止频率</label><input class="input" id="high" type="number" value="45" min="1" step="0.5"></div></div><div class="field"><label>陷波频率</label><select id="notch"><option value="50">50 Hz</option><option value="60">60 Hz</option><option value="0">关闭</option></select></div><button class="btn" id="run" style="width:100%;margin-top:20px" onclick="runAnalysis()">运行分析</button><p class="muted" style="font-size:12px;line-height:1.6">当前内置频域带通与陷波处理。CSV 可直接分析；EDF/BDF 需配置 pyedflib。</p></aside><div><section id="empty" class="card empty">选择文件并运行分析后，在这里查看结果。</section><div id="results" style="display:none"><section class="grid metric-row" id="metrics"></section><section class="grid chart-grid" style="margin-top:18px"><div class="card"><div class="card-head"><h2>滤波前后波形</h2><span class="muted" id="wave-meta"></span></div><canvas class="chart" id="wave-chart" width="720" height="260"></canvas></div><div class="card"><div class="card-head"><h2>FFT 幅频谱</h2><span class="muted">Hz</span></div><canvas class="chart" id="fft-chart" width="720" height="260"></canvas></div><div class="card"><div class="card-head"><h2>PSD 功率谱</h2><span class="muted">dB/Hz</span></div><canvas class="chart" id="psd-chart" width="720" height="260"></canvas></div><div class="card"><div class="card-head"><h2>时频图</h2><span class="muted">时间 × 频率</span></div><canvas class="chart" id="spec-chart" width="720" height="260"></canvas></div></section></div></div></section></main></div><div id="toast" class="toast"></div><script src="/assets/system.js"></script><script>
let files=[];async function loadFiles(){const data=await api('/api/system/analysis/files');files=data.items;$('#record').innerHTML=files.length?files.map(x=>`<option value="${x.id}">${escapeHtml(x.original_name)} · ${x.file_type.toUpperCase()}</option>`).join(''):'<option value="">暂无可分析文件</option>';const requested=new URLSearchParams(location.search).get('record');if(requested&&files.some(x=>x.id===requested))$('#record').value=requested}
function lineChart(id,x,series,colors){const c=$(id),ctx=c.getContext('2d'),w=c.width,h=c.height,p=28;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#20324a';for(let i=0;i<6;i++){const y=p+i*(h-2*p)/5;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke()}const all=series.flat(),min=Math.min(...all),max=Math.max(...all),range=max-min||1;series.forEach((values,k)=>{ctx.strokeStyle=colors[k];ctx.lineWidth=k?2:1;ctx.beginPath();values.forEach((v,i)=>{const px=p+i/Math.max(1,values.length-1)*(w-2*p),py=h-p-(v-min)/range*(h-2*p);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()});ctx.fillStyle='#8ca0b9';ctx.font='11px sans-serif';ctx.fillText(`${x[0]?.toFixed?.(1)||0}`,p,h-8);ctx.fillText(`${x[x.length-1]?.toFixed?.(1)||0}`,w-p-24,h-8)}function heatmap(id,matrix){const c=$(id),ctx=c.getContext('2d'),w=c.width,h=c.height;if(!matrix.length)return;const flat=matrix.flat(),min=Math.min(...flat),max=Math.max(...flat),range=max-min||1,rows=matrix.length,cols=matrix[0].length;ctx.clearRect(0,0,w,h);matrix.forEach((row,y)=>row.forEach((v,x)=>{const t=(v-min)/range;ctx.fillStyle=`hsl(${220-t*180} 80% ${22+t*40}%)`;ctx.fillRect(x*w/cols,h-(y+1)*h/rows,Math.ceil(w/cols),Math.ceil(h/rows))}))}
async function runAnalysis(){if(!$('#record').value){toast('请先上传或选择实验文件');return}const button=$('#run');button.disabled=true;button.textContent='分析中…';try{const d=await api('/api/system/analysis/run',{method:'POST',body:JSON.stringify({record_id:$('#record').value,sample_rate:+$('#sample-rate').value,channel:+$('#channel').value-1,low:+$('#low').value,high:+$('#high').value,notch:+$('#notch').value})});$('#empty').style.display='none';$('#results').style.display='block';const b=d.psd.band_power;$('#metrics').innerHTML=`<div class="metric"><span>检测结果</span><strong>${escapeHtml(d.detection.label)}</strong></div><div class="metric"><span>质量评分</span><strong>${d.detection.score}</strong></div><div class="metric"><span>Alpha 功率</span><strong>${b.alpha}</strong></div><div class="metric"><span>Beta 功率</span><strong>${b.beta}</strong></div><div class="metric"><span>伪迹比例</span><strong>${(d.detection.metrics.artifact_ratio*100).toFixed(2)}%</strong></div>`;$('#wave-meta').textContent=`${d.metadata.channel_label} · ${d.metadata.duration_seconds}s`;lineChart('#wave-chart',d.waveform.time,[d.waveform.raw,d.waveform.filtered],['#52677e','#34d6c7']);lineChart('#fft-chart',d.fft.frequency,[d.fft.amplitude],['#4b8df8']);lineChart('#psd-chart',d.psd.frequency,[d.psd.power_db],['#f6c85f']);heatmap('#spec-chart',d.spectrogram.power_db);toast('分析完成')}catch(e){toast(e.message)}finally{button.disabled=false;button.textContent='运行分析'}}(async()=>{try{await initShell();await loadFiles()}catch(e){toast(e.message)}})();
</script></body></html>
