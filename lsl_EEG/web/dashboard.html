<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页仪表盘 · EEG 智控平台</title><link rel="stylesheet" href="/assets/system.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">EEG</div><div><strong>脑电智控平台</strong><small>Neural Control Center</small></div></div><nav id="side-nav" class="nav"></nav><div class="sidebar-foot"><div class="user-card" id="current-user"></div><button id="logout" class="logout">退出登录</button></div></aside><main class="main"><header class="topbar"><div><h1>首页仪表盘</h1><p id="welcome">系统概览与运行状态</p></div><div class="badge"><span id="stream-dot" class="dot"></span><span id="stream-state">数据流未连接</span></div></header><section class="grid stats"><div class="card"><div class="stat-label">LSL 数据流</div><div class="stat-value" id="stream-name">未连接</div><div class="stat-foot" id="stream-meta">等待设备接入</div></div><div class="card"><div class="stat-label">数据文件</div><div class="stat-value" id="file-count">0</div><div class="stat-foot" id="storage">占用 0 B</div></div><div class="card"><div class="stat-label">系统用户</div><div class="stat-value" id="user-count">0</div><div class="stat-foot" id="active-users">0 位启用</div></div><div class="card"><div class="stat-label">本次运行已完成任务</div><div class="stat-value" id="job-count">0</div><div class="stat-foot">离线分析任务</div></div></section><section class="grid columns"><div class="card"><div class="card-head"><h2>最近数据</h2><a class="link" href="/data">查看全部 →</a></div><div id="recent-files"></div></div><div class="card"><div class="card-head"><h2>快捷入口</h2></div><div id="quick-links" class="grid quick"></div></div></section></main></div><div id="toast" class="toast"></div><script src="/assets/system.js"></script><script>
(async()=>{try{const user=await initShell();$('#welcome').textContent=`欢迎回来，${user.display_name}。这里是系统今日概览。`;const data=await api('/api/system/dashboard');const s=data.stream;$('#stream-name').textContent=s.name||'未连接';$('#stream-meta').textContent=s.connected?`${s.num_channels} 通道 · ${s.sampling_rate||0} Hz`:'等待设备接入';$('#stream-state').textContent=s.streaming?'正在采集':s.connected?'设备已连接':'数据流未连接';$('#stream-dot').classList.toggle('on',s.connected);$('#file-count').textContent=data.counts.files;$('#storage').textContent=`占用 ${bytes(data.counts.storage_bytes)}`;$('#user-count').textContent=data.counts.users;$('#active-users').textContent=`${data.counts.active_users} 位启用`;$('#job-count').textContent=data.counts.completed_jobs;$('#recent-files').innerHTML=data.recent_files.length?`<table><thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>上传时间</th></tr></thead><tbody>${data.recent_files.map(x=>`<tr><td>${escapeHtml(x.original_name)}</td><td>${x.file_type.toUpperCase()}</td><td>${bytes(x.size_bytes)}</td><td>${localTime(x.created_at)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无数据文件，前往离线检测上传。</div>';const nav=(await api('/api/system/navigation')).items.filter(x=>x.path!=='/').slice(0,4);$('#quick-links').innerHTML=nav.map(x=>`<a href="${escapeHtml(x.path)}"><strong>${escapeHtml(x.icon)} ${escapeHtml(x.title)}</strong><span>进入${escapeHtml(x.title)}模块</span></a>`).join('')}catch(e){toast(e.message)}})();
</script></body></html>
