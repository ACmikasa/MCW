<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>用户与权限管理 · EEG 控制平台</title>
  <link rel="stylesheet" href="/assets/legacy-shell.css">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf3ff;background:#07101f;--blue:#2388ff;--border:#ffffff17;--muted:#8c9bb2;--card:#111c2ed9;--red:#ff6259;--green:#35d27d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#163760 0,transparent 34%),#07101f}
    header{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#0b1423cc;backdrop-filter:blur(18px);position:sticky;top:0;z-index:2}h1{font-size:1.2rem;margin:0}header nav{display:flex;align-items:center;gap:10px}a,.link-button{color:#b8c7dc;text-decoration:none;background:none;border:0;cursor:pointer;font-size:.82rem;padding:8px 10px}.user{color:#fff;font-weight:600}
    main{max-width:1200px;margin:0 auto;padding:28px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid var(--border);border-radius:10px;padding:9px 16px;background:#ffffff08;color:#9bacbf;cursor:pointer}.tab.active{background:#147ef1;color:#fff;border-color:#147ef1}
    .panel{border:1px solid var(--border);border-radius:18px;background:var(--card);overflow:hidden;box-shadow:0 18px 50px #0004}.panel-head{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.panel-head h2{font-size:1rem;margin:0}.primary{border:0;border-radius:9px;padding:9px 14px;background:var(--blue);color:#fff;font-weight:650;cursor:pointer}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 20px;border-bottom:1px solid #ffffff0d;font-size:.82rem}th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#2388ff20;color:#7ab9ff}.active-badge{color:var(--green);background:#35d27d1b}.inactive{color:#aaa;background:#ffffff10}.actions{display:flex;gap:6px}.actions button{background:#ffffff09;border:1px solid var(--border);color:#c7d2e3;padding:6px 9px;border-radius:7px;cursor:pointer}.actions .danger{color:#ff8d86}.empty{text-align:center;color:var(--muted);padding:35px}.hidden{display:none!important}
    dialog{width:min(520px,calc(100% - 28px));border:1px solid #ffffff25;border-radius:18px;background:#111c2e;color:#fff;padding:0;box-shadow:0 30px 90px #000b}dialog::backdrop{background:#02050bd9;backdrop-filter:blur(5px)}.dialog-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.dialog-head h3{margin:0;font-size:1.05rem}.close{background:none;border:0;color:#aab7c9;font-size:1.4rem;cursor:pointer}.dialog-body{padding:20px 22px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;color:#9eacc0;font-size:.78rem}.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:#07101f;color:#fff}.check{display:flex;align-items:center;gap:8px;color:#c2cee0;font-size:.82rem;margin:9px 0}.dialog-foot{display:flex;justify-content:flex-end;gap:9px;padding:15px 22px;border-top:1px solid var(--border)}.secondary{border:1px solid var(--border);border-radius:9px;padding:9px 14px;background:#ffffff09;color:#d4deec;cursor:pointer}.message{min-height:20px;color:#ff877f;font-size:.78rem}.permissions{display:grid;grid-template-columns:1fr 1fr;gap:4px 15px}.role-perms{max-width:480px;color:#95a6bd;font-size:.75rem;line-height:1.7}
    #toast{position:fixed;right:24px;bottom:24px;padding:12px 17px;border-radius:10px;background:#18324a;color:#d9edff;box-shadow:0 12px 40px #0008;transform:translateY(80px);opacity:0;transition:.25s}#toast.show{transform:none;opacity:1}
    @media(max-width:760px){header{padding:0 14px}main{padding:16px}th:nth-child(3),td:nth-child(3){display:none}th,td{padding:12px 10px}.permissions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>用户与权限管理</h1><nav><a href="/">首页</a><a href="/realtime">实时监测</a><a href="/data">数据管理</a><a href="/navigation">导航管理</a><span id="current-user" class="user"></span><button id="logout" class="link-button">退出</button></nav></header>
  <main>
    <div class="tabs"><button class="tab active" data-view="users">用户管理</button><button class="tab" data-view="roles">角色与权限</button><button class="tab" data-view="password">修改密码</button></div>
    <section id="users-view" class="panel"><div class="panel-head"><h2>用户列表</h2><button id="add-user" class="primary">新建用户</button></div><div id="users-table"></div></section>
    <section id="roles-view" class="panel hidden"><div class="panel-head"><h2>角色列表</h2><button id="add-role" class="primary">新建角色</button></div><div id="roles-table"></div></section>
    <section id="password-view" class="panel hidden"><div class="panel-head"><h2>修改我的密码</h2></div><form id="password-form" class="dialog-body" style="max-width:480px"><div class="field"><label>当前密码</label><input name="current_password" type="password" required></div><div class="field"><label>新密码（至少 8 位，含字母和数字）</label><input name="new_password" type="password" required></div><div class="message"></div><button class="primary">修改并重新登录</button></form></section>
  </main>
  <dialog id="user-dialog"><form id="user-form"><div class="dialog-head"><h3>新建用户</h3><button class="close" value="cancel" formmethod="dialog" type="button">×</button></div><div class="dialog-body"><input type="hidden" name="id"><div class="field username-field"><label>用户名</label><input name="username" required></div><div class="field"><label>显示名称</label><input name="display_name" required></div><div class="field password-field"><label>初始密码（至少 8 位，含字母和数字）</label><input name="password" type="password"></div><div class="field"><label>角色</label><select name="role_id"></select></div><label class="check"><input name="is_active" type="checkbox" checked> 允许登录</label><div class="message"></div></div><div class="dialog-foot"><button type="button" class="secondary cancel">取消</button><button class="primary">保存</button></div></form></dialog>
  <dialog id="role-dialog"><form id="role-form"><div class="dialog-head"><h3>新建角色</h3><button class="close" type="button">×</button></div><div class="dialog-body"><input type="hidden" name="id"><div class="field name-field"><label>角色标识</label><input name="name" required placeholder="例如 researcher"></div><div class="field"><label>角色说明</label><input name="description"></div><div class="field"><label>权限</label><div id="permission-checks" class="permissions"></div></div><div class="message"></div></div><div class="dialog-foot"><button type="button" class="secondary cancel">取消</button><button class="primary">保存</button></div></form></dialog>
  <div id="toast"></div>
  <script>
    let me,users=[],roles=[],permissions=[];const $=s=>document.querySelector(s);const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    async function api(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(response.status===401){location.href='/login';throw new Error('登录已失效')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'操作失败');return data}
    function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
    async function load(){me=await api('/api/auth/me');$('#current-user').textContent=me.display_name;[users,roles]=await Promise.all([api('/api/auth/users').then(x=>x.items),api('/api/auth/roles').then(x=>x.items)]);if(me.permissions.includes('roles:manage'))permissions=await api('/api/auth/permissions').then(x=>x.items);else document.querySelector('[data-view="roles"]').classList.add('hidden');render()}
    function render(){const roleMap=Object.fromEntries(roles.map(r=>[r.id,r]));$('#users-table').innerHTML=users.length?`<table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${escapeHtml(u.display_name)}</strong><br><span style="color:var(--muted)">@${escapeHtml(u.username)}</span></td><td><span class="badge">${escapeHtml(u.role_description||u.role)}</span></td><td><span class="badge ${u.is_active?'active-badge':'inactive'}">${u.is_active?'正常':'已停用'}</span></td><td>${escapeHtml((u.created_at||'').replace('T',' ').slice(0,16))}</td><td><div class="actions"><button onclick="editUser(${u.id})">编辑</button><button onclick="resetPassword(${u.id})">重置密码</button><button class="danger" onclick="deleteUser(${u.id})" ${u.id===me.id?'disabled':''}>删除</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无用户</div>';
      $('#roles-table').innerHTML=roles.length?`<table><thead><tr><th>角色</th><th>说明</th><th>权限</th><th>操作</th></tr></thead><tbody>${roles.map(r=>`<tr><td><strong>${escapeHtml(r.name)}</strong>${r.is_system?' <span class="badge">系统</span>':''}</td><td>${escapeHtml(r.description)}</td><td><div class="role-perms">${r.permissions.map(p=>escapeHtml(permissions.find(x=>x.code===p)?.description||p)).join(' · ')||'无'}</div></td><td><div class="actions"><button onclick="editRole(${r.id})">编辑</button><button class="danger" onclick="deleteRole(${r.id})" ${r.is_system?'disabled':''}>删除</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无角色</div>';
      $('#user-form select').innerHTML=roles.map(r=>`<option value="${r.id}">${escapeHtml(r.description||r.name)}</option>`).join('');$('#permission-checks').innerHTML=permissions.map(p=>`<label class="check"><input type="checkbox" value="${escapeHtml(p.code)}"> ${escapeHtml(p.description)}</label>`).join('')}
    document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));['users','roles','password'].forEach(x=>$(`#${x}-view`).classList.toggle('hidden',x!==tab.dataset.view))});
    $('#add-user').onclick=()=>{const f=$('#user-form');f.reset();f.elements.id.value='';f.querySelector('h3').textContent='新建用户';f.querySelector('.username-field').classList.remove('hidden');f.querySelector('.password-field').classList.remove('hidden');$('#user-dialog').showModal()};
    window.editUser=id=>{const u=users.find(x=>x.id===id),f=$('#user-form');f.reset();f.elements.id.value=id;f.elements.display_name.value=u.display_name;f.elements.role_id.value=roles.find(r=>r.name===u.role)?.id||'';f.elements.is_active.checked=u.is_active;f.querySelector('h3').textContent='编辑用户';f.querySelector('.username-field').classList.add('hidden');f.querySelector('.password-field').classList.add('hidden');$('#user-dialog').showModal()};
    $('#user-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.elements.id.value;try{const body=id?{display_name:f.elements.display_name.value,role_id:+f.elements.role_id.value,is_active:f.elements.is_active.checked}:{username:f.elements.username.value,display_name:f.elements.display_name.value,password:f.elements.password.value,role_id:+f.elements.role_id.value,is_active:f.elements.is_active.checked};await api(id?`/api/auth/users/${id}`:'/api/auth/users',{method:id?'PUT':'POST',body:JSON.stringify(body)});$('#user-dialog').close();toast('用户已保存');await load()}catch(error){f.querySelector('.message').textContent=error.message}};
    window.resetPassword=async id=>{const password=prompt('请输入新密码（至少 8 位，含字母和数字）');if(!password)return;try{await api(`/api/auth/users/${id}/password`,{method:'PUT',body:JSON.stringify({password})});toast('密码已重置')}catch(error){alert(error.message)}};
    window.deleteUser=async id=>{if(!confirm('确定删除该用户？此操作不可撤销。'))return;try{await api(`/api/auth/users/${id}`,{method:'DELETE'});toast('用户已删除');await load()}catch(error){alert(error.message)}};
    $('#add-role').onclick=()=>{const f=$('#role-form');f.reset();f.elements.id.value='';f.querySelector('h3').textContent='新建角色';f.querySelector('.name-field').classList.remove('hidden');$('#role-dialog').showModal()};
    window.editRole=id=>{const r=roles.find(x=>x.id===id),f=$('#role-form');f.reset();f.elements.id.value=id;f.elements.description.value=r.description;f.querySelector('h3').textContent='编辑角色';f.querySelector('.name-field').classList.add('hidden');f.querySelectorAll('[type=checkbox]').forEach(x=>x.checked=r.permissions.includes(x.value));$('#role-dialog').showModal()};
    $('#role-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.elements.id.value,selected=[...f.querySelectorAll('[type=checkbox]:checked')].map(x=>x.value);try{await api(id?`/api/auth/roles/${id}`:'/api/auth/roles',{method:id?'PUT':'POST',body:JSON.stringify({name:f.elements.name.value,description:f.elements.description.value,permissions:selected})});$('#role-dialog').close();toast('角色已保存');await load()}catch(error){f.querySelector('.message').textContent=error.message}};
    window.deleteRole=async id=>{if(!confirm('确定删除该角色？'))return;try{await api(`/api/auth/roles/${id}`,{method:'DELETE'});toast('角色已删除');await load()}catch(error){alert(error.message)}};
    document.querySelectorAll('dialog .close,dialog .cancel').forEach(x=>x.onclick=()=>x.closest('dialog').close());
    $('#password-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;try{const data=await api('/api/auth/me/password',{method:'PUT',body:JSON.stringify({current_password:f.elements.current_password.value,new_password:f.elements.new_password.value})});alert(data.message);location.href='/login'}catch(error){f.querySelector('.message').textContent=error.message}};
    $('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/login'};load().catch(error=>alert(error.message));
  </script>
  <script src="/assets/legacy-shell.js"></script>
</body>
</html>
