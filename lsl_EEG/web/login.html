<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · EEG 控制平台</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f9ff;background:#07101f}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#173b70 0,transparent 38%),radial-gradient(circle at 85% 80%,#123e39 0,transparent 35%),#07101f}
    .card{width:min(420px,calc(100% - 32px));padding:38px;border:1px solid #ffffff1c;border-radius:24px;background:#101a2cda;box-shadow:0 30px 80px #0008;backdrop-filter:blur(20px)}
    .brand{font-size:.72rem;color:#70aefc;letter-spacing:.18em;font-weight:700}.card h1{margin:10px 0 6px;font-size:1.75rem}.hint{margin:0 0 28px;color:#9ba9bf;font-size:.9rem}
    label{display:block;margin:15px 0 7px;color:#c8d2e2;font-size:.82rem}input{width:100%;padding:13px 14px;border:1px solid #ffffff1c;border-radius:11px;background:#050b16aa;color:#fff;font-size:1rem;outline:none}input:focus{border-color:#4a9aff;box-shadow:0 0 0 3px #0a84ff25}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#1684ff,#5368f5);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    #message{min-height:22px;margin:14px 0 0;color:#ff8178;font-size:.82rem}.security{margin-top:20px;padding-top:16px;border-top:1px solid #ffffff12;color:#728198;font-size:.74rem;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">EEG CONTROL PLATFORM</div><h1>欢迎回来</h1>
    <p class="hint">登录后进入脑电监测系统</p>
    <form id="login-form">
      <label for="username">用户名</label><input id="username" autocomplete="username" required autofocus>
      <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登录</button><div id="message" role="alert"></div>
    </form>
    <div class="security">会话凭据保存在安全 Cookie 中，密码不会发送到除当前服务以外的位置。</div>
  </main>
  <script>
    const form=document.getElementById('login-form'),button=document.getElementById('submit'),message=document.getElementById('message');
    form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;message.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'登录失败');location.href='/';}catch(error){message.textContent=error.message;}finally{button.disabled=false;}});
  </script>
</body>
</html>
