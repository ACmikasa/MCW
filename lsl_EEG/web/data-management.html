<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据管理 · EEG 智控平台</title><link rel="stylesheet" href="/assets/system.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">EEG</div><div><strong>脑电智控平台</strong><small>Neural Control Center</small></div></div><nav id="side-nav" class="nav"></nav><div class="sidebar-foot"><div class="user-card" id="current-user"></div><button id="logout" class="logout">退出登录</button></div></aside><main class="main"><header class="topbar"><div><h1>数据管理</h1><p>集中查看、筛选、下载与清理 EEG 原始数据</p></div><a class="btn" href="/offline" style="text-decoration:none">＋ 上传并分析</a></header><section class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="stat-label">数据文件</div><div class="stat-value" id="files">0</div><div class="stat-foot">已纳入管理</div></div><div class="card"><div class="stat-label">存储占用</div><div class="stat-value" id="size">0 B</div><div class="stat-foot">上传目录</div></div><div class="card"><div class="stat-label">文件类型</div><div class="stat-value" id="types">0 / 0 / 0</div><div class="stat-foot">CSV / EDF / BDF</div></div></section><section class="card"><div class="toolbar"><input class="input" id="query" placeholder="搜索文件名"><select id="type"><option value="">全部类型</option><option>csv</option><option>edf</option><option>bdf</option></select><button class="btn secondary" onclick="load()">查询</button></div><div id="table"></div></section></main></div><div id="toast" class="toast"></div><script src="/assets/system.js"></script><script>
let user;async function load(){try{const data=await api(`/api/system/data?q=${encodeURIComponent($('#query').value)}&file_type=${encodeURIComponent($('#type').value)}`);$('#files').textContent=data.stats.file_count;$('#size').textContent=bytes(data.stats.total_bytes);const c=data.stats.type_counts;$('#types').textContent=`${c.csv} / ${c.edf} / ${c.bdf}`;$('#table').innerHTML=data.items.length?`<table><thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>上传时间</th><th>分析状态</th><th>操作</th></tr></thead><tbody>${data.items.map(x=>`<tr><td>${escapeHtml(x.original_name)}</td><td>${x.file_type.toUpperCase()}</td><td>${bytes(x.size_bytes)}</td><td>${localTime(x.created_at)}</td><td><span class="status ${x.status==='failed'?'failed':''}">${({uploaded:'已上传',queued:'排队中',analyzing:'分析中',running:'分析中',completed:'已完成',failed:'失败'})[x.status]||escapeHtml(x.status)}</span></td><td><div class="actions"><a class="btn secondary small" href="/api/system/data/${x.id}/download" style="text-decoration:none">下载</a>${user.permissions.includes('data:manage')?`<button class="btn danger small" onclick="removeFile('${x.id}')">删除</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无匹配的数据文件</div>'}catch(e){toast(e.message)}}async function removeFile(id){if(!confirm('删除后无法恢复，确定继续吗？'))return;try{await api(`/api/system/data/${id}`,{method:'DELETE'});toast('数据文件已删除');await load()}catch(e){toast(e.message)}}$('#query').addEventListener('keydown',e=>{if(e.key==='Enter')load()});(async()=>{try{user=await initShell();await load()}catch(e){toast(e.message)}})();
</script></body></html>
